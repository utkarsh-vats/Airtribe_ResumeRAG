# Tool configuration only; this project is not packaged.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "venv", ".chroma"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
    # pydocstyle: require docstrings on public modules, classes, methods and functions.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
"scripts/**" = ["D1"]
"notebooks/**" = ["D1"]
# The Python-version guard (UP036 calls it outdated) must run before any other import.
"resume_rag.py" = ["E402", "UP036"]
"job_matcher.py" = ["E402", "UP036"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # chromadb 1.5.9's telemetry module on Python 3.14; not our code.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.*",
]
