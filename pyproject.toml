# Tool configuration only; this project is not packaged.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "venv", ".chroma"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
    # pydocstyle: require docstrings on public modules, classes, methods and functions.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
"scripts/**" = ["D1"]
"notebooks/**" = ["D1"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
